<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English to Malayalam SRT Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { color: #333; text-align: center; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; text-align: center; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #ff4b4b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:disabled { background: #bbb; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
        #downloadBtn {
            display: none;
            background: #28a745;
            text-align: center;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎬 SRT Translator</h2>
    <p>ഇംഗ്ലീഷ് സബ്‌ടൈറ്റിൽ ഫയൽ മലയാളത്തിലേക്ക് തനത് സംഭാഷണ ശൈലിയിൽ മാറ്റാം.</p>

    <label for="apiKey">Gemini API Key:</label>
    <input type="text" id="apiKey" placeholder="AI Studio-ൽ നിന്നുള്ള API Key നൽകുക">

    <label for="srtFile">English SRT File തിരഞ്ഞെടുക്കുക:</label>
    <input type="file" id="srtFile" accept=".srt">

    <button id="translateBtn" onclick="startTranslation()">മലയാളത്തിലേക്ക് മാറ്റുക</button>

    <div id="status"></div>
    <a id="downloadBtn" class="download-link" href="#" download="Malayalam_Subtitle.srt">
        <button type="button" style="background:#28a745; margin-top:0;">Malayalam SRT ഡൗൺലോഡ് ചെയ്യുക</button>
    </a>
</div>

<script>
// നേരത്തെ സേവ് ചെയ്ത API Key ഉണ്ടെങ്കിൽ കാണിക്കുക
document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';

async function startTranslation() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('srtFile');
    const status = document.getElementById('status');
    const btn = document.getElementById('translateBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!apiKey) {
        alert("ദയവായി Gemini API Key നൽകുക!");
        return;
    }
    if (!fileInput.files[0]) {
        alert("ദയവായി ഒരു SRT ഫയൽ തിരഞ്ഞെടുക്കുക!");
        return;
    }

    localStorage.setItem('gemini_key', apiKey); // API Key സേവ് ചെയ്തു വെക്കും
    const file = fileInput.files[0];
    status.style.color = "blue";
    status.innerText = "ഫയൽ വായിക്കുന്നു...";
    btn.disabled = true;
    downloadBtn.style.display = "none";

    const reader = new FileReader();
    reader.onload = async function(e) {
        const content = e.target.result;
        status.innerText = "വിവർത്തനം നടക്കുന്നു... ദയവായി അല്പം കാത്തിരിക്കുക...";

        const prompt = `You are an expert movie subtitle translator and Malayalam dialogue writer.
Translate the following English SRT content into natural, conversational, spoken Malayalam (മലയാളികൾ സിനിമകളിൽ സാധാരണ സംസാരിക്കുന്ന തനത് ശൈലിയിൽ).

CRITICAL RULES:
1. Maintain the exact line numbers and timestamps (e.g., 00:01:20,000 --> 00:01:23,000) WITHOUT any change.
2. Only translate dialogue text into spoken, colloquial Malayalam.
3. Output ONLY valid SRT. Do NOT add notes, markdown, or greetings.

SRT Content:
${content}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error.message);
            }

            let result = data.candidates[0].content.parts[0].text.trim();
            if (result.startsWith("```")) {
                result = result.replace(/^```[a-z]*\n/, '').replace(/\n```$/, '');
            }

            // ഡൗൺലോഡ് ലിങ്ക് ഉണ്ടാക്കുന്നു
            const blob = new Blob([result], { type: "text/plain;charset=utf-8" });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.style.display = "block";

            status.style.color = "green";
            status.innerText = "വിവർത്തനം വിജയകരമായി പൂർത്തിയായി!";
        } catch (err) {
            status.style.color = "red";
            status.innerText = "Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    };
    reader.readAsText(file);
}
</script>

</body>
</html>
